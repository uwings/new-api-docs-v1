services:
  new-api-docs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCS_HOME_MODE: ${DOCS_HOME_MODE:-docs}
        DOCS_SITE_NAME: ${DOCS_SITE_NAME:-New API}
        DOCS_SITE_URL: ${DOCS_SITE_URL:-http://localhost:3600}
        DOCS_CONSOLE_URL: ${DOCS_CONSOLE_URL:-}
    container_name: new-api-docs
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3600:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/zh/docs').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5