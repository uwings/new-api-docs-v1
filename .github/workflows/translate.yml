name: Auto Translate Documents

on:
  push:
    branches: ['main']
    paths:
      - 'content/docs/zh/**/*.md'
      - 'content/docs/zh/**/*.mdx'
      - 'content/docs/en/**/*.md'
      - 'content/docs/en/**/*.mdx'
      - 'content/docs/ja/**/*.md'
      - 'content/docs/ja/**/*.mdx'
  workflow_dispatch:
    inputs:
      mode:
        description: '翻译模式'
        required: true
        type: choice
        default: 'changed'
        options:
          - changed
          - force_all
          - missing_only
          - specific_path
      path:
        description: '指定路径'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install

      - name: 🔍 Get changed files
        id: changed-files
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="changed"; fi
          echo "📋 翻译模式: $MODE"
          FILES_LIST=$(mktemp)

          if [ "$MODE" = "force_all" ]; then
            find content/docs/zh -name "*.md" -o -name "*.mdx" > "$FILES_LIST"
          elif [ "$MODE" = "specific_path" ]; then
            SPECIFIC_PATH="${{ github.event.inputs.path }}"
            [ -z "$SPECIFIC_PATH" ] && echo "❌ 需要指定路径" && exit 1
            FULL_PATH="content/docs/zh/$SPECIFIC_PATH"
            [ ! -e "$FULL_PATH" ] && echo "❌ 路径不存在: $FULL_PATH" && exit 1
            if [ -d "$FULL_PATH" ]; then
              find "$FULL_PATH" \( -name "*.md" -o -name "*.mdx" \) > "$FILES_LIST"
            else
              echo "$FULL_PATH" > "$FILES_LIST"
            fi
          elif [ "$MODE" = "missing_only" ]; then
            while IFS= read -r -d '' zh_file; do
              rel_path="${zh_file#content/docs/zh/}"
              [ ! -f "content/docs/en/$rel_path" ] || [ ! -f "content/docs/ja/$rel_path" ] && echo "$zh_file" >> "$FILES_LIST"
            done < <(find content/docs/zh \( -name "*.md" -o -name "*.mdx" \) -print0)
          else
            git diff --name-only HEAD~1 HEAD | grep -E '^content/docs/zh/.*\.(md|mdx)$' >> "$FILES_LIST" || true
            DELETED_TRANSLATIONS=$(git diff --name-only HEAD~1 HEAD | grep -E '^content/docs/(en|ja)/.*\.(md|mdx)$' || echo "")
            if [ -n "$DELETED_TRANSLATIONS" ]; then
              echo "$DELETED_TRANSLATIONS" | while IFS= read -r trans_file; do
                [ -z "$trans_file" ] && continue
                rel_path="${trans_file#content/docs/en/}"; rel_path="${rel_path#content/docs/ja/}"
                zh_file="content/docs/zh/$rel_path"
                [ -f "$zh_file" ] && echo "$zh_file" >> "$FILES_LIST"
              done
            fi
            sort -u "$FILES_LIST" -o "$FILES_LIST"
          fi

          if [ ! -s "$FILES_LIST" ]; then
            echo "✅ 没有需要翻译的文档"; echo "has_changes=false" >> $GITHUB_OUTPUT
            rm -f "$FILES_LIST"
          else
            echo "📊 待翻译 $(wc -l < $FILES_LIST) 个文件"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            cp "$FILES_LIST" /tmp/translate_files.txt
            rm -f "$FILES_LIST"
          fi

      - name: 🌐 Translate documents
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          IS_PUSH="${{ github.event_name == 'push' }}"
          if [ "$IS_PUSH" = "true" ]; then
            FORCE_TRANSLATE=true xargs -d '\n' bun run translate < /tmp/translate_files.txt
          else
            xargs -d '\n' bun run translate < /tmp/translate_files.txt
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://airider.cn/v1' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'glm-4-flash' }}
          FALLBACK_API_KEY: ${{ secrets.FALLBACK_API_KEY || '' }}
          MAX_RETRIES: '3'
          RETRY_DELAY: '2'
          RETRY_BACKOFF: '2.0'
          MAX_WORKERS: '3'

      - name: 📝 Commit & Push translations
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/docs/en/ content/docs/ja/
          if git diff --staged --quiet; then
            echo "ℹ No translation changes to commit"
          else
            git commit -m "🌐 auto-translate: update en/ja docs (${{ github.event_name }})"
            git push
          fi
