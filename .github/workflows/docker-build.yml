name: Docker build

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --build-arg DOCS_HOME_MODE=docs -t new-api-docs:test .