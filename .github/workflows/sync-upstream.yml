name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/QuantumNous/new-api-docs-v1.git
          git fetch upstream main
          git checkout -B sync/upstream-main origin/main
          git merge --no-edit upstream/main

      - name: Push sync branch
        run: git push --force-with-lease origin sync/upstream-main

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head sync/upstream-main \
            --title "chore: sync upstream documentation" \
            --body "Automated weekly sync from QuantumNous/new-api-docs-v1. Review build checks before merging." \
            || gh pr edit sync/upstream-main \
              --title "chore: sync upstream documentation" \
              --body "Automated weekly sync from QuantumNous/new-api-docs-v1. Review build checks before merging."